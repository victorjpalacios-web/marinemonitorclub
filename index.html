  const e=$('#pvEdit'); if (e) e.onclick=()=>openEditor(structuredClone(P.base));
  const d=$('#pvDel'); if (d) d.onclick=()=>confirmBox(`¿Borrar la rutina «${r.name}»?`,'Borrar',()=>{ deleteCustom(r.id); $('#ov').innerHTML=''; P=null; render(); });
  const dp=$('#pvDup'); if (dp) dp.onclick=()=>{ const c=cleanRoutine(r); c.id='u_'+uid(); c.custom=true; c.created=Date.now(); c.name=r.name+' (copia)'; delete c.short; openEditor(c); };
}

/* ---------- Sonido, vibración, pantalla ---------- */
let actx=null, wake=null;
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){} }
function beep(f=880, d=0.12, v=0.25){ if(!actx) return; try{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type='sine';
  g.gain.setValueAtTime(v, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+d); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d+0.02); }catch(e){} }
/* Sonidos con Web Audio: se mezclan con la música en vez de pararla.
   La música solo se baja durante la cuenta atrás (navigator.audioSession, iPhone con iOS 17+). */
const SOUNDS = {
  rest3:  [[523,.1],[0,.08],[523,.1],[0,.08],[523,.16]],         /* empieza el descanso */
  tick:   [[440,.14]],                                         /* cuenta atrás 10…4 */
  tickHi: [[587,.16]],                                         /* 3, 2, 1 */
  go:     [[392,.12],[494,.12],[587,.12],[784,.5]],            /* ¡empieza! */
  done:   [[784,.14],[0,.05],[784,.14],[0,.05],[587,.45]],     /* fin del crono */
};
const SBUF={};
function sndBuf(name){
  if (SBUF[name]) return SBUF[name];
  const parts=SOUNDS[name], sr=actx.sampleRate, n=Math.round(parts.reduce((a,p)=>a+p[1],0)*sr), buf=actx.createBuffer(1,n,sr), d=buf.getChannelData(0);
  let k=0; parts.forEach(([f,len])=>{ const m=Math.round(len*sr); for (let i=0;i<m&&k<n;i++,k++){ const t=i/sr, env=Math.min(1,i/(sr*.005),(m-i)/(sr*.03));
    const raw=f? Math.sin(2*Math.PI*f*t)+.6*Math.sin(4*Math.PI*f*t)+.35*Math.sin(6*Math.PI*f*t)+.2*Math.sin(8*Math.PI*f*t) : 0;
    d[k]=Math.tanh(2*raw)*env*.98; } });
  return SBUF[name]=buf;
}
function setSession(t){ try{ if (navigator.audioSession) navigator.audioSession.type=t; }catch(e){} }
setSession('ambient');
let DUCK=false, duckTimer=null;
function duckOn(){ if (S.settings.duck===false || DUCK) return; DUCK=true; clearTimeout(duckTimer); setSession('transient'); setTimeout(unlockAudio,50); }
function duckOff(delay=1200){ clearTimeout(duckTimer); duckTimer=setTimeout(()=>{ DUCK=false; setSession('ambient'); setTimeout(unlockAudio,50); }, delay); }
function primeAlert(){ unlockAudio(); }
function playBuf(name){ try{ const src=actx.createBufferSource(), g=actx.createGain(); src.buffer=sndBuf(name); g.gain.value=1; src.connect(g); g.connect(actx.destination); src.start(); }catch(e){} }
/* Si el sistema ha pausado el audio (pantalla bloqueada, cambio de app, otra app de audio…),
   se reanuda antes de sonar, para que ningún pitido se pierda. */
function snd(name){
  unlockAudio(); if (!actx) return;
  if (actx.state==='running') { playBuf(name); return; }
  try{ actx.resume().then(()=>playBuf(name)).catch(()=>{}); }catch(e){}
}
/* 10 pitidos: suena en cada segundo de la cuenta atrás; los 3 últimos más altos */
/* Los pitidos se programan por adelantado con el reloj de audio (no con temporizadores),
   así suenan a su hora aunque el móvil ralentice la app para ahorrar batería. */
let SCHED=[], PLANNED=false;
function schedAt(name, inSec){
  if (!actx || actx.state!=='running') return false;
  try{ const src=actx.createBufferSource(), g=actx.createGain(); src.buffer=sndBuf(name); g.gain.value=1; src.connect(g); g.connect(actx.destination);
    src.start(actx.currentTime+Math.max(0,inSec)); SCHED.push(src); src.onended=()=>{ SCHED=SCHED.filter(x=>x!==src); }; return true; }catch(e){ return false; }
}
function clearSched(){ SCHED.forEach(x=>{ try{ x.onended=null; x.stop(); }catch(e){} }); SCHED=[]; PLANNED=false; }
function planSounds(){
  clearSched();
  if (!W || W.finished || W.pausedAt) return;
  unlockAudio(); if (!actx) return;
  if (actx.state!=='running'){ try{ actx.resume().then(()=>{ if (actx.state==='running' && !PLANNED) planSounds(); }).catch(()=>{}); }catch(e){} return; }
  const now=vt(), s=curStep(); let end=null, cd=0, last='go';
  if (W.phase==='rest'){ end=(W.restDur-(now-W.phaseStart))/1000; cd=W.restDur>12000?10:3; }
  else if (s && s.time && W.prepUntil){ end=(W.prepUntil-now)/1000; cd=10; }
  else if (s && s.time && !W.ready){ end=(s.time*1000-(now-W.phaseStart))/1000; cd=3; last='done'; }
  if (end==null || end<=0.05) return;
  for (let k=cd;k>=1;k--){ const at=end-k; if (at>-0.15) schedAt(k<=3?'tickHi':'tick', at); }
  PLANNED = schedAt(last, end);
}
function sleepAudio(delay=0){ setTimeout(()=>{ if (W && !W.finished && !W.pausedAt) return; try{ if (actx && actx.state==='running') actx.suspend(); }catch(e){} }, delay); }
function countBeep(sec, from){ if (sec===from || !DUCK) duckOn(); if (!PLANNED) snd(sec<=3?'tickHi':'tick'); if (sec<=3) buzz(50); }
function goSound(){ snd('go'); buzz([120,60,120]); duckOff(1400); }
function warnNext(){}
function testAlert(){ unlockAudio(); duckOn(); for (let i=10;i>=1;i--) setTimeout(()=>snd(i<=3?'tickHi':'tick'), (10-i)*1000); setTimeout(()=>goSound(), 10000); }
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
async function lockScreen(){ try{ if ('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseScreen(){ try{ wake && wake.release(); }catch(e){} wake=null; }
document.addEventListener('visibilitychange',()=>{ if (document.visibilityState==='visible' && W && !W.finished){ lockScreen(); unlockAudio(); tick(); planSounds(); } });
/* Cualquier toque en la pantalla reactiva el audio por si el sistema lo había pausado */
document.addEventListener('pointerdown',()=>{ if (actx && actx.state!=='running' && W && !W.finished && !W.pausedAt){ unlockAudio(); setTimeout(planSounds,80); } }, true);
/* Durante el entreno, se comprueba cada pocos segundos que el audio sigue activo */
setInterval(()=>{ if (W && !W.finished && !W.pausedAt && actx && actx.state!=='running'){ try{ actx.resume().then(()=>{ if (actx.state==='running') planSounds(); }).catch(()=>{}); }catch(e){} } }, 3000);

/* ---------- Reproductor ---------- */
let W=null, ticker=null;
const vt = () => (W.pausedAt ?? Date.now()) - W.pausedMs;
function persistActive(){ if (W && !W.finished) lsSet('wk.active', W); }
function startWorkout(r, cfg){
  unlockAudio(); primeAlert(); lockScreen();
  const steps=compile(r,cfg);
  W={ routineId:r.id, routineName:r.name, mode:S.settings.mode, steps, i:0, phase:'work', startedAt:Date.now(), pausedAt:null, pausedMs:0,
      phaseStart:0, restDur:0, work:0, rest:0, done:steps.map(()=>false), kg:{}, lastBeep:null, warned:false, ready:false, finished:false };
  W.phaseStart=vt(); W.ready=needsReady(steps[0]); W.oi=r.blocks.map((b,i)=>b._oi??i);
  steps.forEach(s=>{ if (s.kg && S.settings.lastKg[s.name]!=null) W.kg[s.name]=S.settings.lastKg[s.name]; });
  P=null; persistActive(); drawPlayer(); if (!W.ready) goSound();
}
function resumeActive(){ const a=lsGet('wk.active'); if(!a) return; W=a; primeAlert(); unlockAudio(); lockScreen(); drawPlayer(); planSounds(); }
function curStep(){ return W.steps[W.i]; }
/* Ejercicios por tiempo fuera de circuito (farmers walk, plancha…): el crono espera a que pulses Empezar */
function needsReady(s){ return !!(s && s.time && !s.round); }
function startTimed(){ if (!W.ready || W.phase!=='work') return; unlockAudio(); W.ready=false; W.prepUntil=vt()+10000; W.lastBeep=null; buzz(40); persistActive(); drawPlayer(); tick(); planSounds(); }
function skipPrep(){ if (!W.prepUntil) return; clearSched(); W.prepUntil=0; W.phaseStart=vt(); W.lastBeep=null; goSound(); persistActive(); drawPlayer(); planSounds(); }
function blockStarts(){ const idx=[]; W.steps.forEach((s,i)=>{ const p=W.steps[i-1]; if (!p || p.bi!==s.bi || (!s.round && p.name!==s.name)) idx.push(i); }); return idx; }
function closePhase(){ const el=vt()-W.phaseStart; if (W.phase==='work') W.work+=el; else if (W.phase==='rest') W.rest+=el; }
function setDone(){
  if (W.phase!=='work' || W.pausedAt) return;
  unlockAudio(); primeAlert();
  if (W.ready || W.prepUntil) W.phaseStart=vt();
  closePhase(); W.done[W.i]=true; W.ready=false; W.prepUntil=0; buzz(40);
  const s=curStep();
  if (W.i>=W.steps.length-1) { finishWorkout(); return; }
  if (s.rest>0){ W.phase='rest'; W.restDur=s.rest*1000; W.phaseStart=vt(); W.lastBeep=null; W.warned=false; }
  else { goTo(W.i+1, false); return; }
  persistActive(); drawPlayer(); planSounds();
  if (s.rest>12 && !schedAt('rest3', s.time?0.65:0)) setTimeout(()=>snd('rest3'), s.time?650:0);
}
function goTo(i, close=true){
  if (close) closePhase();
  if (close && (W.ready || W.prepUntil)) W.phaseStart=vt();
  W.prepUntil=0;
  W.i=Math.max(0,Math.min(W.steps.length-1,i)); W.phase='work'; W.phaseStart=vt(); W.lastBeep=null; W.warned=false; W.ready=needsReady(W.steps[W.i]);
  persistActive(); drawPlayer(); planSounds();
}
function endRest(natural){ if (W.phase!=='rest') return; const had=PLANNED && natural===true; if (natural!==true) clearSched(); unlockAudio(); closePhase(); goTo(W.i+1,false);
  /* tras la cuenta atrás del descanso, los ejercicios por tiempo arrancan solos */
  if (natural===true && W.ready){ W.ready=false; W.phaseStart=vt(); persistActive(); drawPlayer(); }
  if (W.ready) duckOff(0); else if (had){ buzz([120,60,120]); duckOff(1400); } else goSound();
  planSounds(); }
function adjustRest(d){ if (W.phase!=='rest') return; W.restDur=Math.max(5000, W.restDur+d*1000); if (W.restDur-(vt()-W.phaseStart)>10500){ W.warned=false; W.lastBeep=null; duckOff(0); } persistActive(); tick(); planSounds(); }
function togglePause(){ if (W.pausedAt){ W.pausedMs+=Date.now()-W.pausedAt; W.pausedAt=null; unlockAudio(); } else { W.pausedAt=Date.now(); W.lastBeep=null; duckOff(0); clearSched(); sleepAudio(300); } persistActive(); drawPlayer(); planSounds(); }
function tick(){
  if (!W || W.finished || !$('#pDigits')) return;
  const now=vt(), el=now-W.phaseStart, s=curStep();
  { const t=clock(now-W.startedAt), e=$('#pTotal'); if (e.textContent!==t) e.textContent=t; }
  let show, frac=0, sub='';
  if (W.phase==='rest'){
    const left=W.restDur-el; show=clock(Math.ceil(left/1000)*1000); frac=Math.min(1,el/W.restDur); sub=`de ${clock(W.restDur)}`;
    const sec=Math.ceil(left/1000);
    const pl=document.querySelector('.player'); if (pl) pl.classList.toggle('warn', left<=10000 && !W.pausedAt);
    if (left<=10000) sub='¡Prepárate! Siguiente serie';
    const cd = W.restDur>12000 ? 10 : 3;
    if (!W.pausedAt && sec<=cd && sec>0 && W.lastBeep!==sec){ W.lastBeep=sec; countBeep(sec, cd); }
    if (!W.pausedAt && left<=0){ endRest(true); return; }
  } else if (s.time && W.prepUntil){
    const left=W.prepUntil-now, sec=Math.ceil(left/1000);
    show=clock(Math.max(0,sec)*1000); frac=Math.min(1,1-left/10000); sub=`${s.name} · ${clock(s.time*1000)}`;
    const pl=document.querySelector('.player'); if (pl) pl.classList.toggle('warn', !W.pausedAt);
    if (!W.pausedAt && sec<=10 && sec>0 && W.lastBeep!==sec){ W.lastBeep=sec; countBeep(sec, 10); }
    if (!W.pausedAt && left<=0){ const had=PLANNED; W.phaseStart=W.prepUntil; W.prepUntil=0; W.lastBeep=null; if (pl) pl.classList.remove('warn'); if (had){ buzz([120,60,120]); duckOff(1400); } else goSound(); persistActive(); drawPlayer(); planSounds(); return; }
  } else if (s.time && W.ready){
    show=clock(s.time*1000); frac=0; sub='pulsa Empezar cuando estés listo';
  } else if (s.time){
    const left=s.time*1000-el; show=clock(Math.ceil(left/1000)*1000); frac=Math.min(1,el/(s.time*1000)); sub=s.cap?`${s.reps} reps · máx. ${s.time} s`:`objetivo ${clock(s.time*1000)}`;
    const sec=Math.ceil(left/1000);
    if (!W.pausedAt && sec<=3 && sec>0 && W.lastBeep!==sec){ W.lastBeep=sec; buzz(50); if (!PLANNED) snd('tickHi'); }
    if (!W.pausedAt && left<=0){ if (!PLANNED) snd('done'); duckOff(1000); setDone(); return; }
  } else { show=clock(el); frac=(el%60000)/60000; sub='tiempo de serie'; }
  /* solo se toca la pantalla cuando algo cambia: menos trabajo = menos batería */
  const d=$('#pDigits'), sb=$('#pSub'), rg=$('#pRing');
  if (d.textContent!==show) d.textContent=show;
  if (sb.dataset.v!==sub){ sb.dataset.v=sub; sb.textContent=sub; }
  const off=(2*Math.PI*46*(1-frac)).toFixed(1); if (rg.getAttribute('stroke-dashoffset')!==off) rg.setAttribute('stroke-dashoffset', off);
}
/* Círculo de progreso de la rutina: % hecho, con color según lo que falta */
function progColor(pct){ return pct>=100?'#34D399':pct>=75?'#A3E635':pct>=50?'#FACC15':pct>=25?'#FB923C':'#F87171'; }
function progRing(doneN, blkIdx, nBlk){
  const tot=W.steps.length, pct=Math.round(doneN/tot*100), R=42, C=2*Math.PI*R, col=progColor(pct);
  const leftS=W.steps.reduce((a,s,i)=>W.done[i]?a:a+(s.time||40)+(+s.rest||0),0), leftM=Math.max(0,Math.round(leftS/60));
  const msg = pct>=100 ? 'Rutina completada' : leftM<=1 ? 'Te queda ~1 min' : `Te quedan ~${leftM} min`;
  return `<div class="pring-row">
    <div class="pring" role="progressbar" aria-label="Progreso de la rutina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${R}" class="trk"/><circle cx="50" cy="50" r="${R}" class="bar" style="stroke:${col};stroke-dasharray:${C};stroke-dashoffset:${C*(1-pct/100)}"/></svg>
      <b>${pct}<small>%</small></b>
    </div>
    <div class="pring-txt"><p><strong>${doneN} de ${tot} series</strong></p><p>${`Bloque ${Math.min(blkIdx,nBlk)} de ${nBlk} · ${msg}`}</p>
      <div class="pseg" aria-hidden="true">${[0,25,50,75].map(t=>`<i style="background:${pct>t?progColor(t+1):'rgba(255,255,255,.22)'}"></i>`).join('')}</div></div>
  </div>`;
}
function drawPlayer(){
  document.body.classList.toggle('eco', !!(S.settings && S.settings.eco));
  const s=curStep(), isRest=W.phase==='rest';
  const shown = isRest ? W.steps[W.i+1] : s;
  const doneN=W.done.filter(Boolean).length;
  const bs=blockStarts(); const blkIdx=bs.filter(k=>k<=(isRest?W.i+1:W.i)).length;
  const next = isRest ? W.steps[W.i+2] : W.steps[W.i+1];
  const C=2*Math.PI*46;
  const kgVal = W.kg[shown.name] ?? '';

function canvasToBlob(c, type='image/jpeg', q=.85){ return new Promise(res=>c.toBlob(b=>res(b), type, q)); }
async function blobToCanvas(blob, maxSide=1600){
  const url=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('No se pudo leer la imagen')); i.src=url; });
    const sc=Math.min(1, maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); return c;
  } finally { URL.revokeObjectURL(url); }
}
async function shrinkBlob(blob, maxSide, q=.82){ const c=await blobToCanvas(blob, maxSide); return canvasToBlob(c,'image/jpeg',q); }
function blobToDataURL(b){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); }); }
function normBox(b){ let [x0,y0,x1,y1]=b.map(Number); if ([x0,y0,x1,y1].some(v=>!isFinite(v))) return null;
  if (Math.max(x0,y0,x1,y1)>1.5){ x0/=1000; y0/=1000; x1/=1000; y1/=1000; }
  const c=v=>Math.max(0,Math.min(1,v)); x0=c(x0); y0=c(y0); x1=c(x1); y1=c(y1);
  if (x1<x0) [x0,x1]=[x1,x0]; if (y1<y0) [y0,y1]=[y1,y0];
  return (x1-x0<0.02||y1-y0<0.02) ? null : [x0,y0,x1,y1]; }
function cropPage(canvas, box, pad=0.006){
  const [x0,y0,x1,y1]=box; const W0=canvas.width, H0=canvas.height;
  const sx=Math.max(0,(x0-pad)*W0), sy=Math.max(0,(y0-pad)*H0), sw=Math.min(W0,(x1+pad)*W0)-sx, sh=Math.min(H0,(y1+pad)*H0)-sy;
  const sc=Math.min(1, 900/Math.max(sw,sh));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(sw*sc)); c.height=Math.max(1,Math.round(sh*sc));
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(canvas,sx,sy,sw,sh,0,0,c.width,c.height);
  return canvasToBlob(c,'image/jpeg',.86);
}
function setExBlob(x, blob){ if (x._prev) URL.revokeObjectURL(x._prev); x._blob=blob; x._prev=blob?URL.createObjectURL(blob):null; if (!blob){ x.photo=''; } }

const LIB={ pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', zip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' };
function loadScript(src){
  if (document.querySelector(`script[data-lib="${src}"]`)) return window.__libs[src];
  window.__libs = window.__libs || {};
  return window.__libs[src] = new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.dataset.lib=src; s.onload=res; s.onerror=()=>rej(new Error('No se pudo cargar una librería necesaria.')); document.head.appendChild(s); });
}
async function pdfPages(file, max){
  await loadScript(LIB.pdfw); await loadScript(LIB.pdf);
  const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[];
  for (let i=1;i<=Math.min(doc.numPages,max);i++){
    const pg=await doc.getPage(i); const v0=pg.getViewport({scale:1});
    const v=pg.getViewport({scale:Math.min(3, 1600/Math.max(v0.width,v0.height))});
    const c=document.createElement('canvas'); c.width=Math.round(v.width); c.height=Math.round(v.height);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x, viewport:v}).promise; out.push(c);
  }
  return { pages:out, total:doc.numPages };
}
async function excelImages(buf){
  const zip=await JSZip.loadAsync(buf); const DP=new DOMParser(); const NSR='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const xml=async p=>{ const f=zip.file(p); return f? DP.parseFromString(await f.async('text'),'application/xml'):null; };
  const rels=async p=>{ const d=await xml(p); const m={}; if (d) for (const r of d.getElementsByTagName('Relationship')) m[r.getAttribute('Id')]={t:r.getAttribute('Target'),type:r.getAttribute('Type')||''}; return m; };
  const resolve=(base,t)=>{ if (t.startsWith('/')) return t.slice(1); const parts=base.split('/'); parts.pop(); for (const seg of t.split('/')){ if (seg==='..') parts.pop(); else if (seg!=='.') parts.push(seg); } return parts.join('/'); };
  const relsOf=p=>p.replace(/([^/]+)$/,'_rels/$1.rels');
  const wbx=await xml('xl/workbook.xml'); const wbr=await rels('xl/_rels/workbook.xml.rels'); const out={};
  if (!wbx) return out;
  for (const sh of wbx.getElementsByTagName('sheet')){
    const name=sh.getAttribute('name'); const rid=sh.getAttribute('r:id')||sh.getAttributeNS(NSR,'id');
    if (!wbr[rid]) continue; const sp=resolve('xl/workbook.xml', wbr[rid].t);
    const sr=await rels(relsOf(sp));
    for (const r of Object.values(sr)){
      if (!/\/drawing$/.test(r.type)) continue;
      const dp=resolve(sp,r.t); const dx=await xml(dp); if (!dx) continue; const dr=await rels(relsOf(dp));
      const anchors=[...dx.getElementsByTagNameNS('*','twoCellAnchor'),...dx.getElementsByTagNameNS('*','oneCellAnchor')];
      for (const a of anchors){
        const from=a.getElementsByTagNameNS('*','from')[0]; const blip=a.getElementsByTagNameNS('*','blip')[0]; if (!from||!blip) continue;
        const row=+from.getElementsByTagNameNS('*','row')[0].textContent+1;
        const emb=blip.getAttribute('r:embed')||blip.getAttributeNS(NSR,'embed'); if (!dr[emb]) continue;
        const mp=resolve(dp,dr[emb].t); if (!/\.(png|jpe?g|gif|webp)$/i.test(mp)) continue;
        const f=zip.file(mp); if (!f) continue;
        const type=/png$/i.test(mp)?'image/png':/gif$/i.test(mp)?'image/gif':/webp$/i.test(mp)?'image/webp':'image/jpeg';
        (out[name]=out[name]||{})[row]=new Blob([await f.async('uint8array')],{type});
      }
    }
  }
  return out;
}
async function excelData(file){
  await loadScript(LIB.xlsx); await loadScript(LIB.zip);
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const imgs=/\.xlsx$|\.xlsm$/i.test(file.name) ? await excelImages(buf).catch(()=>({})) : {};
  let text='';
  for (const name of wb.SheetNames){
    const ws=wb.Sheets[name]; if (!ws || !ws['!ref']) continue;
    const rng=XLSX.utils.decode_range(ws['!ref']);
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:true,defval:'',raw:false});
    text+=`\n## Hoja: ${name}\n`;
    rows.forEach((r,i)=>{ const n=rng.s.r+i+1; const cells=r.map(c=>String(c).trim()).filter(Boolean); const im=imgs[name]&&imgs[name][n];
      if (cells.length||im) text+=`R${n}: ${cells.join(' | ')}${im?' [imagen]':''}\n`; });
  }
  return { text:text.slice(0,140000), imgs };
}
const IMPORT_PROMPT = `You convert workout documents into JSON for a workout timer app.
Return ONLY JSON of the form {"routines":[Routine]}.
Routine = {"name": short name in Spanish, "sub": one-line description in Spanish, "note": general notes in Spanish or "", "blocks":[Block]}.
Block = Exercise or Circuit.
Exercise = {"type":"exercise", "name": exercise name in Spanish (translate; keep usual terms like TRX, pike push up), "sets": integer, "reps": text such as "10–12", "10-12-10-8", "30 s" or "10 c/p", "rest": rest seconds after each set (integer; if the document gives none use 60 for strength, 30 for core or HIIT, 10 for stretches), "timeSec": work seconds if the exercise is held or timed, else null, "tip": short technique cue in Spanish (max 25 words) or "", "weight": suggested load text or "", "page": 1-based number of the image where the exercise's picture appears or null, "box": [left, top, right, bottom] as fractions 0-1 of that image's width and height enclosing ONLY the picture(s) of this exercise (all its phases, no text) or null, "sheet": spreadsheet sheet name or null, "row": spreadsheet row number of the exercise or null}.

    const routines = Array.isArray(res) ? res : (res && res.routines) || [];
    if (!routines.length) throw new Error('No he encontrado ejercicios en el archivo. Revisa que sea una rutina o añade una indicación.');
    setStatus('Recortando las imágenes de cada ejercicio…');
    IMP.pages=ctx.pages; IMP.pageURLs=[];
    IMP.drafts=[];
    for (const rt of routines){ const d=toDraft(rt, ctx); await attachImages(d, ctx); if (d.blocks.length) IMP.drafts.push(d); }
    if (!IMP.drafts.length) throw new Error('No he podido montar ninguna rutina con ese archivo.');
    IMP.screen='list';
    if (IMP.drafts.length===1) openEditor(IMP.drafts[0], true); else drawImport();
  }catch(e){
    const code=e&&e.code;
    IMP.error = code==='not_granted' ? 'Has denegado el permiso para usar Claude en esta página. Puedes activarlo desde el menú de permisos del artifact.'
      : code==='rate_limited' ? 'Has hecho muchas lecturas seguidas. Espera un poco y vuelve a intentarlo.'
      : code==='invalid_json' ? 'La respuesta no se pudo interpretar. Vuelve a intentarlo o añade una indicación.'
      : (e&&e.message) || 'No se pudo leer el archivo.';
    IMP.screen='start'; drawImport();
  }
}
function IMP_PROMPT_CTX(){ return IMPORT_PROMPT + `\nThe user's category for this routine: ${CATN[IMP.cat]}.` + (IMP.hint?`\nUser instructions: ${IMP.hint}`:''); }
function toDraft(rt, ctx){
  const d={ id:'u_'+uid(), custom:true, created:Date.now(), name:String(rt.name||'Rutina importada').slice(0,60), sub:String(rt.sub||'').slice(0,100), note:String(rt.note||''), cat:IMP.cat, mode:IMP.mode, blocks:[] };
  const ex=(e,inC)=>{
    const x={ n:String(e.name||'Ejercicio'), s:inC?0:Math.max(1,parseInt(e.sets)||3), r:String(e.reps||''), rest:inC?0:Math.max(0,parseInt(e.rest)||0), t:String(e.tip||''), w:String(e.weight||'') };
    const ts=parseInt(e.timeSec); if (ts>0) x.time=ts;
    if (ctx.pages.length && e.page && Array.isArray(e.box)){ const pi=(+e.page)-1; const b=normBox(e.box); if (ctx.pages[pi] && b) x._src={page:pi, box:b}; }
    if (ctx.imgs && e.row){ const sheet = e.sheet && ctx.imgs[e.sheet] ? e.sheet : Object.keys(ctx.imgs).find(k=>ctx.imgs[k][e.row]); const m=sheet&&ctx.imgs[sheet]; const r=+e.row; const b=m&&(m[r]||m[r-1]||m[r+1]); if (b) x._xblob=b; }
    return x;
  };
  (rt.blocks||[]).forEach(b=>{
    if (b && b.type==='circuit' && Array.isArray(b.items) && b.items.length) d.blocks.push({ circuit:true, n:String(b.name||'Circuito'), rounds:Math.max(1,parseInt(b.rounds)||3), between:Math.max(0,parseInt(b.between)||0), roundRest:Math.max(0,parseInt(b.roundRest)||60), items:b.items.map(i=>ex(i,true)) });
    else if (b) d.blocks.push(ex(b,false));
  });
  return d;
}
function eachEx(d, fn){ d.blocks.forEach((b,bi)=>{ if (b.circuit) b.items.forEach((it,ii)=>fn(it,bi,ii)); else fn(b,bi,-1); }); }
async function attachImages(d, ctx){

function sha256hex(str){
  const rr=(v,n)=>(v>>>n)|(v<<(32-n)); const K=[]; let pr=0, c=2;
  while (pr<64){ let ok=true; for (let d=2;d*d<=c;d++) if (c%d===0){ ok=false; break; } if (ok){ K[pr++]=(Math.pow(c,1/3)*4294967296)|0; } c++; }
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const b=new TextEncoder().encode(str), l=b.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(b); m[l]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(n-4,l*8); dv.setUint32(n-8,Math.floor(l*8/4294967296));
  for (let o=0;o<n;o+=64){ const w=new Array(64); for (let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for (let i=16;i<64;i++){ const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3), s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let [a,bb,cc,d,e,f,g,h]=H;
    for (let i=0;i<64;i++){ const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0, S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&bb)^(a&cc)^(bb&cc), t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=cc; cc=bb; bb=a; a=(t1+t2)|0; }
    H=[H[0]+a,H[1]+bb,H[2]+cc,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x|0); }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

function openSignup(){
  $('#modal').innerHTML=`<div class="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="suT">
    <h3 id="suT">Prueba gratis 24 h</h3>
    <p class="muted small" style="margin-top:4px">Déjanos tus datos y entra ya. Victor recibirá tu solicitud de acceso.</p>
    <form id="suForm" novalidate>
      <div class="field"><label for="suN">Nombre</label><input class="t" id="suN" autocomplete="given-name" required></div>
      <div class="field"><label for="suA">Apellidos</label><input class="t" id="suA" autocomplete="family-name" required></div>
      <div class="field"><label for="suM">Móvil</label><input class="t" id="suM" type="tel" inputmode="tel" autocomplete="tel" placeholder="+34 600 000 000" required></div>
      <div class="field"><label for="suE">Email</label><input class="t" id="suE" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="nombre@correo.com" required></div>
      <p class="gerr" id="suErr" role="alert" hidden></p>
      <div class="actions"><button class="btn ghost" type="button" id="suNo">Cancelar</button><button class="btn primary" type="submit" id="suOk">Solicitar y entrar</button></div>
    </form></div></div>`;
  $('#suNo').onclick=closeModal;
  $('#suForm').onsubmit=async e=>{ e.preventDefault();
    const d={ nombre:$('#suN').value.trim(), apellidos:$('#suA').value.trim(), movil:$('#suM').value.trim(), email:$('#suE').value.trim().toLowerCase() };
    const err=$('#suErr'), bad=m=>{ err.textContent=m; err.hidden=false; };
    if (!d.nombre||!d.apellidos) return bad('Escribe tu nombre y apellidos.');
    if (d.movil.replace(/\D/g,'').length<9) return bad('Escribe un móvil válido.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return bad('Escribe un email válido.');
    let used=[]; try{ used=JSON.parse(localStorage.getItem('wod.trials'))||[]; }catch(_){}
    if (used.includes(d.email)) return bad('Ya usaste la prueba gratis con este email en este dispositivo.');
    $('#suOk').disabled=true; $('#suOk').textContent='Enviando…';
    let sent=false;
    try{
      const body=new URLSearchParams({ 'form-name':'acceso', ...d, fecha:new Date().toLocaleString('es-ES') }).toString();
      const r=await fetch('/', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body });
      sent=r.ok;
    }catch(_){}
    used.push(d.email); try{ localStorage.setItem('wod.trials', JSON.stringify(used)); }catch(_){}
    saveAuth({ key:'trial-'+d.email.replace(/[^a-z0-9]/g,'_'), user:d.nombre, trial:true, until:Date.now()+TRIAL_MS, email:d.email });
    if (sent){ location.reload(); return; }
    const mail=`mailto:${OWNER_EMAIL}?subject=${encodeURIComponent('Solicitud de acceso · VP WOD App')}&body=${encodeURIComponent(`Nombre: ${d.nombre} ${d.apellidos}\nMóvil: ${d.movil}\nEmail: ${d.email}`)}`;
    $('#modal').innerHTML=`<div class="modal"><div class="sheet" role="dialog" aria-modal="true"><h3>Ya puedes entrar</h3>
      <p class="muted" style="margin-top:6px">Tu prueba de 24 h está activa. No se pudo enviar la solicitud automáticamente: envíala por email para que Victor te dé acceso completo.</p>
      <div class="actions"><a class="btn ghost" href="${mail}" style="text-align:center;text-decoration:none">Enviar por email</a><button class="btn primary" id="suGo">Entrar</button></div></div></div>`;
    $('#suGo').onclick=()=>location.reload();
  };
  setTimeout(()=>$('#suN').focus(),50);
}

function tr(x){
  const n=nrm(x); if (!n) return null;
  const d=EN_DICT[fnv36(n)]; if (d) return d;
  for (const [re,f] of PATS){ const m=n.match(re); if (m){ const r=f(m); if (r!=null && r!==n) return r; } }
  let u=n; UNIT.forEach(([a,b])=>{ u=u.replace(a,b); }); return u!==n?u:null;
}
const TR_ATTRS=['placeholder','aria-label','title','alt'];
function trText(t){ const v=t.nodeValue; if (!v || !/[A-Za-zÀ-ÿ¿¡]/.test(v)) return; const p=t.parentElement; if (p && p.closest('script,style,textarea')) return;
  const r=tr(v); if (r!=null && r!==nrm(v)) t.nodeValue=v.match(/^\s*/)[0]+r+v.match(/\s*$/)[0]; }
function trAttrs(el){ TR_ATTRS.forEach(a=>{ const v=el.getAttribute && el.getAttribute(a); if (v){ const r=tr(v); if (r!=null && r!==nrm(v)) el.setAttribute(a,r); } }); }
function trTree(root){
  if (root.nodeType===3){ trText(root); return; }
  if (root.nodeType!==1) return;
  if (root.matches('script,style')) return;
  trAttrs(root); root.querySelectorAll('*').forEach(trAttrs);
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; const list=[]; while ((n=w.nextNode())) list.push(n); list.forEach(trText);
}
