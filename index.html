  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#14213D; --muted:#5B6478; --line:#D5DBE5;
  --work:#2446D8; --work-soft:#DCE3FB; --rest:#D97A06; --rest-soft:#FBEBD3; --go:#0B8F7C; --go-soft:#D5F0EB; --danger:#C2362B; --on-accent:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1626; --surface:#16223A; --sunk:#1D2B47; --ink:#E8EDF6; --muted:#93A0B8; --line:#2A3A58;
    --work:#7B95FF; --work-soft:#22325E; --rest:#FFB347; --rest-soft:#43341C; --go:#41CFB9; --go-soft:#173E3C; --danger:#FF7A6E; --on-accent:#0D1626;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1626; --surface:#16223A; --sunk:#1D2B47; --ink:#E8EDF6; --muted:#93A0B8; --line:#2A3A58;
  --work:#7B95FF; --work-soft:#22325E; --rest:#FFB347; --rest-soft:#43341C; --go:#41CFB9; --go-soft:#173E3C; --danger:#FF7A6E; --on-accent:#0D1626;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html{font-size:17.5px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
.cond{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--work);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:18px 16px 24px}
h1,h2,h3{margin:0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.01em;line-height:1.05}
h1{font-size:2.4rem}
h2{font-size:1.55rem}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
section{margin-top:22px}

/* mode switch */
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,61,.12)}
.seg.full{display:flex}.seg.full button{flex:1}

/* today block */
.today{background:var(--surface);border-radius:20px;padding:20px;border-left:6px solid var(--accent,var(--work))}
.today.go{--accent:var(--go)}
.today .kicker{font-weight:600;color:var(--accent,var(--work));font-size:.95rem}
.today h2{font-size:2.1rem;margin-top:4px}
.facts{display:flex;gap:18px;margin:14px 0 4px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:600;line-height:1}
.facts span{font-size:.8rem;color:var(--muted)}
.exlist{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.exlist li span:last-child{color:var(--ink);font-weight:700;white-space:nowrap;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.15rem}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:1.02rem;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--accent,var(--work));color:var(--on-accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:.78rem;line-height:1.2}
.day b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:600}
.day .lab{display:block;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.day.now{border-color:var(--work);border-width:2px}
.day.done{background:var(--work-soft)}
.day .tick{display:block;height:14px;color:var(--work);font-weight:700}

/* routine cards */
.rlist{display:grid;gap:10px;margin-top:12px}
.rcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rcard .row{align-items:baseline}
.rcard h3{font-size:1.35rem}
.tag{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--work-soft);color:var(--work)}
.tag.go{background:var(--go-soft);color:var(--go)}

/* stats & chart */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px}
.stat b{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:600;line-height:1;display:block}
.stat span{font-size:.82rem;color:var(--muted)}
.chartbox{background:var(--surface);border-radius:16px;padding:14px 12px 8px;margin-top:12px}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);padding:6px 4px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pernav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.pernav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:1.2rem}
.pernav strong{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:600}
.hist{list-style:none;padding:0;margin:10px 0 0}
.hist li{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist .x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;width:36px;height:36px;border-radius:10px}
.bars{list-style:none;padding:0;margin:8px 0 0}
.bars li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.9rem;padding:6px 0}
.bars .track{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;background:var(--work)}
.bars .fill.go{background:var(--go)}
.empty{background:var(--surface);border-radius:16px;padding:22px;text-align:center;margin-top:12px}
.sync{font-size:.8rem;color:var(--muted);margin-top:18px;text-align:center}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
.tabbar .in{display:flex;max-width:560px;width:100%}
.tabbar button{flex:1;border:0;background:transparent;padding:10px 0 12px;font-weight:600;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--work)}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov .wrap{max-width:560px;margin:0 auto;padding:14px 16px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:44px;height:44px;padding:0 12px;font-weight:600}
.blk{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.blk input[type=checkbox]{width:22px;height:22px;margin-top:3px;accent-color:var(--work)}
.blk.off{opacity:.5}
.blk .meta{font-size:.88rem;color:var(--muted)}
.blk details{grid-column:2;font-size:.88rem;color:var(--muted)}
.blk details summary{cursor:pointer;color:var(--work);font-weight:500}
.circ{grid-column:2;margin-top:6px;padding-left:10px;border-left:2px solid var(--line);font-size:.9rem}
.stepper{display:inline-flex;align-items:center;gap:8px;margin-top:6px}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
.note{background:var(--rest-soft);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-top:10px}
.sticky-go{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* player */
.player{--phase:var(--work);--phase-soft:var(--work-soft)}
.player.rest{--phase:var(--rest);--phase-soft:var(--rest-soft)}
.tot{text-align:center}
.tot b{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:600;display:block;line-height:1}
.tot span{font-size:.75rem;color:var(--muted)}
.prog{height:5px;background:var(--sunk);border-radius:3px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--phase);transition:width .3s}
.exname{margin-top:16px}
.exname h2{font-size:2rem}
.exname p{margin-top:4px}
.dial{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:18px auto 6px}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .ph{font-weight:600;color:var(--phase);font-size:1rem}
.dial .digits{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(4.2rem,22vw,6rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dial .sub{font-size:.85rem;color:var(--muted)}
.pctl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;margin-top:10px}
.pctl .main{background:var(--phase);color:var(--on-accent);font-size:1.2rem;padding:18px}
.pctl .side{min-width:64px}
.kg{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:10px 14px;margin-top:14px}
.kg input{width:84px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:1.1rem;font-weight:600;text-align:center}
.tip{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:.92rem}
.nextup{margin-top:8px;font-size:.92rem;color:var(--muted);text-align:center}
.exnav{display:flex;gap:10px;margin-top:12px}
.exnav .btn{flex:1;font-size:.92rem;padding:11px}
.paused .dial .digits{opacity:.4}
.fig{display:block;width:100%;height:auto}
.fig polyline{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fig polyline.back{stroke:var(--muted);opacity:.7}
.fig circle{fill:var(--ink)}
.fig .floor{stroke:var(--line);stroke-width:2}
.fig polyline.strap{stroke:var(--rest);stroke-width:1.8;opacity:.9}
.fig circle.anchor{fill:var(--muted)}
.fig text.tag{font:600 8px system-ui,sans-serif;fill:var(--muted)}
.player .fig text.tag{fill:var(--phase)}
.fig rect.box{fill:var(--sunk);stroke:var(--line);stroke-width:1}
.pvfig{background:var(--bg);border-radius:12px;max-width:170px;margin:2px 0 8px}
.citem{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;margin-top:6px}
.citem .fig{background:var(--bg);border-radius:10px}
.cstrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cstrip span{font-size:.8rem;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.cstrip span.on{background:var(--phase);color:var(--on-accent);font-weight:600}
.ytw{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.vedit{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;width:28px;height:26px;font-size:.85rem;line-height:1;padding:0}
.vlist{list-style:none;padding:0;margin:12px 0 0}
.vlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.vown{font-size:.72rem;font-weight:600;color:var(--go);background:var(--go-soft);border-radius:999px;padding:1px 7px}
.yt{display:inline-block;font-size:.85rem;font-weight:600;color:#C4302B;text-decoration:none;padding:2px 0}
.yt:hover{text-decoration:underline}
.ytrow{text-align:center;margin-top:8px}
.how{background:var(--surface);border-radius:14px;padding:10px 14px;margin-top:8px;font-size:.92rem}
.how summary,.howp summary{cursor:pointer;font-weight:600;color:var(--phase,var(--work))}
.how ol,.howp ol,.howl{margin:8px 0 2px 20px;padding:0}
.how li,.howp li,.howl li{margin:5px 0;line-height:1.4}
.howp{margin-top:4px;font-size:.86rem;color:var(--ink)}
.howl{color:var(--ink)}
.figtip{display:grid;grid-template-columns:minmax(120px,46%) 1fr;gap:12px;align-items:center}
.figtip .fig{background:var(--bg);border-radius:12px}
.player .fig polyline:not(.back):not(.strap){stroke:var(--phase)}
.player .fig circle:not(.anchor){fill:var(--phase)}

.modal{position:fixed;inset:0;z-index:60;background:rgba(10,16,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet .sel{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center;margin-top:14px}
.sheet select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.banner{background:var(--work-soft);border-radius:14px;padding:12px 14px;margin-top:14px}

.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:11px}
.iconbtn.danger,.btn.danger,.linkbtn.danger{color:var(--danger)}
.iconbtn:disabled{opacity:.4}
.linkbtn{border:0;background:transparent;padding:6px 4px;font-weight:600;font-size:.88rem;color:var(--work)}
.pickers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:10px;margin-top:6px}
@media (max-width:480px){.pickers{grid-template-columns:1fr;gap:0}}
select.big{font-size:1rem;font-weight:600;padding:12px 10px;background:var(--surface);color:var(--ink)}
#backPlan{margin-top:6px;padding-left:0;text-align:left}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:14px -2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.9rem;color:var(--muted)}
.chip span{font-weight:500;opacity:.7}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.plain{background:var(--sunk);color:var(--muted)}
.rc-in{display:flex;gap:12px;align-items:center}
.rthumb{width:76px;flex:none;border-radius:10px;overflow:hidden;background:var(--bg)}
.rthumb .photo{max-height:70px;border-radius:0}
.photo{display:block;width:100%;height:auto;max-height:240px;object-fit:contain;background:#fff;border-radius:12px}
.pphoto{margin-top:12px;border-radius:14px;overflow:hidden;background:#fff}
.pphoto .photo{max-height:30vh;border-radius:0}
.dial.small{width:min(56vw,210px);margin-top:12px}
.dial.small .digits{font-size:clamp(3.2rem,15vw,4.4rem)}
.field{display:grid;gap:4px;margin-top:12px}
.field label{font-size:.84rem;color:var(--muted)}
input.t,select.t{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{display:grid;gap:3px;font-size:.74rem;color:var(--muted)}
.mini input{padding:8px 6px;text-align:center;color:var(--ink);font-size:.95rem}
.exed{background:var(--surface);border-radius:14px;padding:12px;margin-top:10px}
.circed{border:2px dashed var(--line);border-radius:16px;padding:12px;margin-top:12px}
.circed .exed{background:var(--bg)}
.circed .exed input.t{background:var(--surface)}
.thumb{width:92px;height:76px;flex:none;border-radius:10px;border:1px dashed var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.thumb .fig{width:100%}
.note.err{background:var(--sunk);border-left:4px solid var(--danger)}
.busy{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:14px;margin-top:14px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--work-soft);border-top-color:var(--work);animation:spin 0.9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sheet.tall{max-height:94vh}
.cropwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:crosshair}
.cropwrap img{width:100%;display:block;pointer-events:none}
.cropbox{position:absolute;border:2px solid var(--work);background:rgba(36,70,216,.14);box-shadow:0 0 0 9999px rgba(10,16,30,.35)}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
/* reps grandes, descansos editables, arrastrar */
.setof{font-weight:600}
.repsbig{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-top:10px;padding:8px 18px;border-radius:16px;background:var(--phase-soft);max-width:100%}
.repsbig b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(2.6rem,13vw,3.6rem);line-height:1;color:var(--phase)}
.repsbig span{font-size:1.05rem;font-weight:600;color:var(--muted)}
.rp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.35rem;font-weight:700;color:var(--ink)}
.citem .rp{font-size:1.2rem}
.blk{position:relative;padding-right:48px}
.drag{position:absolute;top:6px;right:4px;width:40px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:1.4rem;line-height:1;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.drag:active{cursor:grabbing}
.blk.dragging{z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.45);outline:2px solid var(--accent,var(--work));transition:none}
.blk.shift{transition:transform .15s}
.restctl{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.88rem;color:var(--muted)}
.restctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.05rem}
.restctl strong{color:var(--ink);min-width:2.8em;text-align:center;font-variant-numeric:tabular-nums}
.restall{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-radius:14px;padding:10px 14px;margin-top:12px}
.restall .restctl{margin-top:0}
.restall .restctl button{width:auto;padding:0 10px}
.player.warn .dial .digits{color:var(--phase);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.player.warn .dial .digits{animation:none}.blk.shift{transition:none}}
.plantitle{display:flex;align-items:center;gap:6px;font-size:.95rem;font-weight:700;color:var(--muted)}
.plantitle button{border:0;background:transparent;color:var(--work);font-size:.95rem;padding:2px 6px;border-radius:8px;white-space:nowrap}
.today .plantitle{margin-bottom:4px}
.drag{color:var(--work);background:var(--sunk)}
.roitem{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;position:relative}
.roitem .drag{position:static;flex:none}
.roitem.lock{opacity:.6;justify-content:flex-start}
.rolock{color:var(--work);font-weight:700;width:24px;text-align:center}

/* Calentamiento de 10 minutos al inicio de los Días 1–4 */
const WARM = X('Comba',1,'10 min',60,{time:600,warm:true,t:'Calentamiento: ritmo suave al principio y ve subiendo poco a poco.'});
function warmCfg(){ const w=S.settings.warm||{}; const n=(w.n||'').trim()||'Comba'; const min=Math.max(1,Math.min(60,+w.min||10)); return { n, min }; }
function editWarm(after){
  const w=warmCfg();
  $('#modal').innerHTML=`<div class="modal"><div class="sheet" role="dialog" aria-modal="true"><h3>Calentamiento</h3>
    <p class="muted small" style="margin-top:4px">Se aplica al calentamiento de los Días 1 a 4 y de las rutinas de kettlebell.</p>
    <div class="field"><label for="wN">Actividad</label><input class="t" id="wN" value="${esc(w.n)}" placeholder="Comba, running, burpees, bici…"></div>
    <div class="field"><label for="wM">Minutos</label><input class="t" id="wM" type="number" inputmode="numeric" min="1" max="60" value="${w.min}"></div>
    <div class="actions"><button class="btn ghost" id="mNo">Cancelar</button><button class="btn primary" id="mOk">Guardar</button></div></div></div>`;
  $('#mNo').onclick=closeModal;
  $('#mOk').onclick=()=>{ S.settings.warm={ n:$('#wN').value.trim()||'Comba', min:Math.max(1,Math.min(60,Math.round(+$('#wM').value||10))) }; saveSettings(); closeModal(); after&&after(); };
  setTimeout(()=>{ const i=$('#wN'); i.focus(); i.select(); },50);
}
['d1','d2','d3','d4','kb','kbc'].forEach(id=>{ const r=ROUTINES.find(x=>x.id===id); if (r){ r.blocks.unshift(structuredClone(WARM)); r.warm=true; } });
/* Título del plan al que pertenece cada rutina (editable desde la vista previa) */
const PLAN_OF = {
  'Plan Volumen 3200Kcal.9':['d1','d2','d3','d4','mat','z2','hiit'],
  'MERY Rutina':['mary1','mary2','mary3','mary4','mary5'],
  'Kettlebell':['kb','kbc'],
  'Definición KB + TRX':['def1','def2','def3','def4'],
  'TRX':['trx8','trx3','trxbase','trxflex'],
  'On the go · Hotel y viajes':['ha','hb','hc','hd','hotelx','hotelc'],
  'Recuperación y cardio':['est','run','mob'],
  'Postura · Rutina de mañana':['post'],
};
Object.entries(PLAN_OF).forEach(([t,ids])=>ids.forEach(id=>{ const r=ROUTINES.find(x=>x.id===id); if (r) r.plan=t; }));
const RBY = Object.fromEntries(ROUTINES.map(r => [r.id, r]));
function planOf(r){ const t=(S.settings.titles||{})[r.id]; return (t&&t.trim()) || r.plan || CATN[r.cat] || 'Otra'; }
function editTitle(r, after){
  $('#modal').innerHTML=`<div class="modal"><div class="sheet" role="dialog" aria-modal="true"><h3>Título del plan</h3>
    <p class="muted small" style="margin-top:4px">Se muestra encima de «${esc(r.name)}».</p>
    <input class="t" id="ttIn" value="${esc(planOf(r))}" style="margin-top:10px" aria-label="Título del plan">
    <label class="row" style="gap:8px;margin-top:10px;font-size:.9rem"><input type="checkbox" id="ttAll" checked> Aplicar a todas las rutinas de «${esc(planOf(r))}»</label>
    <div class="actions"><button class="btn ghost" id="mNo">Cancelar</button><button class="btn primary" id="mOk">Guardar</button></div></div></div>`;
  $('#mNo').onclick=closeModal;
  $('#mOk').onclick=()=>{ const v=$('#ttIn').value.trim(), old=planOf(r); S.settings.titles=S.settings.titles||{};
    const ids=$('#ttAll').checked ? allR().filter(x=>planOf(x)===old).map(x=>x.id) : [r.id];
    ids.forEach(id=>{ if (v) S.settings.titles[id]=v; else delete S.settings.titles[id]; });
    saveSettings(); closeModal(); after&&after(); };
  const i=$('#ttIn'); i.focus(); i.select();
}

const HOW = {
  "Extensión torácica en silla": ["Siéntate con el respaldo de la silla a la altura de la espalda alta (debajo de los omóplatos).", "Manos entrelazadas detrás de la nuca, codos al frente.", "Echa la espalda alta hacia atrás sobre el respaldo, abriendo los codos, y vuelve despacio.", "La lumbar no se arquea: el movimiento sale de la zona del pecho. Respira lento."],
  "Estiramiento en puerta": ["Colócate en el marco de una puerta con los antebrazos apoyados a los lados, codos a la altura de los hombros.", "Da un paso adelante con una pierna hasta notar el estiramiento en el pecho.", "Abdomen firme y cabeza alineada; no dejes que los hombros se vayan hacia delante.", "Mantén respirando lento. Debe estirar, no doler."],
  "Elevaciones en Y en prono": ["Túmbate boca abajo en la esterilla, frente apoyada o mirando al suelo.", "Brazos estirados por encima de la cabeza formando una Y, pulgares hacia arriba.", "Despega los brazos del suelo llevando los omóplatos atrás y abajo. Pausa 1 s arriba.", "Baja controlado. El cuello no se estira ni se tensa."],
  "Aperturas con banda": ["De pie, sujeta una banda elástica con los brazos estirados al frente, a la altura del pecho.", "Abre los brazos hacia los lados hasta que la banda toque el pecho, juntando los omóplatos.", "Hombros lejos de las orejas y codos casi estirados.", "Vuelve despacio, sin dejar que la banda tire de ti."],
  "Ángeles contra la pared": ["Espalda pegada a la pared, pies un palmo por delante y rodillas un poco flexionadas.", "Cabeza, espalda alta y brazos (codos y dorso de las manos) en contacto con la pared, brazos en forma de W.", "Desliza los brazos hacia arriba sin despegarlos y vuelve a bajar a la W.", "Si los brazos se despegan o se arquea la lumbar, acorta el recorrido."],
  "Retracción de barbilla (chin tucks)": ["De pie o sentado, espalda recta y mirada al frente.", "Lleva la barbilla hacia atrás en línea recta, como haciendo papada, sin bajar la cabeza.", "Mantén 2 segundos notando la nuca estirarse.", "Suelta despacio y repite."],
  "Plancha invertida": ["Siéntate con las piernas estiradas y las manos en el suelo detrás de la cadera, dedos hacia los pies.", "Empuja con las manos y los talones y sube la cadera hasta formar una línea de hombros a talones.", "Pecho abierto, hombros lejos de las orejas y glúteos apretados.", "Si te molesta la parte delantera del hombro, flexiona las rodillas o déjala."],
  'Jumping jacks': ['De pie, pies juntos y brazos pegados al cuerpo.','Salta abriendo las piernas un poco más que la cadera mientras subes los brazos por los lados hasta juntarlos arriba.','Salta de nuevo para volver a la posición inicial.','Aterriza suave sobre la parte delantera del pie y mantén un ritmo cómodo: es calentamiento, no esfuerzo máximo.'],
  'Rotaciones de hombro y brazos': ['De pie, pies a la anchura de la cadera y abdomen activo.','Brazos estirados a los lados: haz círculos pequeños que vas agrandando poco a poco.','A mitad de tiempo cambia de sentido (de delante hacia atrás).','Termina con 4–5 círculos grandes de brazo completo, sin arquear la zona lumbar.'],
  'Sentadillas suaves': ['Pies a la anchura de los hombros, puntas ligeramente hacia fuera.','Baja llevando la cadera atrás y abajo, como si te sentaras, con el pecho alto y los brazos al frente.','Rodillas en la dirección de las puntas de los pies; talones siempre apoyados.','Sube despacio. Recorrido completo pero sin forzar: el objetivo es calentar rodillas y cadera.'],
  'Zancadas atrás sin salto': ['De pie, manos en la cintura.','Da un paso largo hacia atrás con una pierna y baja hasta que la rodilla de atrás casi toque el suelo.','La rodilla delantera queda sobre el tobillo, sin pasar de la punta del pie.','Empuja con el talón delantero para volver y alterna de pierna en cada repetición.'],
  'Zancada atrás': ['De pie, torso recto y abdomen apretado; brazos en la cintura o al frente.','Paso largo hacia atrás y baja en vertical hasta que la rodilla trasera quede a 2–3 cm del suelo.','Ambas rodillas a unos 90°; el peso va en el talón de la pierna delantera.','Sube empujando con el talón delantero. Haz las 10 de una pierna y luego las 10 de la otra.','Hacia atrás en vez de hacia delante carga menos la rodilla cuando vas rápido.'],
  'Sentadillas': ['Pies algo más abiertos que la cadera, puntas un poco hacia fuera.','Baja con la cadera atrás hasta que los muslos queden paralelos al suelo, pecho alto.','No dejes que las rodillas se vayan hacia dentro; empújalas suavemente hacia fuera.','Sube rápido apretando glúteos arriba. Ritmo alto pero recorrido completo.'],
  'Burpees': ['De pie, agáchate y apoya las manos en el suelo a la anchura de los hombros.','Lanza los pies atrás hasta quedar en plancha alta y haz una flexión.','Salta con los pies hacia las manos para quedar en cuclillas.','Salta hacia arriba estirando el cuerpo y los brazos por encima de la cabeza.','Si vas muy cansado, quita el salto final o la flexión, pero mantén el ritmo.'],
  'Puente de glúteo a una pierna': ['Túmbate boca arriba, rodillas dobladas y pies apoyados cerca del glúteo; brazos en el suelo junto al cuerpo.','Estira una pierna en línea con el muslo de la otra.','Empuja con el talón apoyado y sube la cadera hasta formar una línea recta de hombros a rodilla.','Aprieta el glúteo 1 segundo arriba sin arquear la lumbar y baja controlado.','10 repeticiones con una pierna y luego 10 con la otra.'],
  'Flexiones': ['Manos un poco más abiertas que los hombros, dedos hacia delante.','Cuerpo recto de la cabeza a los talones: glúteos y abdomen apretados, sin dejar caer la cadera.','Baja hasta que el pecho quede a un puño del suelo con los codos a unos 45° del cuerpo.','Empuja el suelo para subir, soltando el aire.'],
  'Flexiones diamante': ['Junta las manos bajo el esternón formando un rombo con pulgares e índices.','Pies algo separados para tener equilibrio y cuerpo en línea recta.','Baja con los codos pegados al cuerpo, apuntando hacia atrás, hasta casi tocar las manos con el pecho.','Sube empujando: trabaja sobre todo tríceps y la parte interna del pecho.','Si cuestan, separa un poco las manos o apoya las rodillas.'],
  'Flexiones pies elevados': ['Apoya los pies en el borde de la cama o una silla y las manos en el suelo, algo más abiertas que los hombros.','Cuerpo recto: no dejes que la cadera se hunda ni se suba.','Baja el pecho hacia el suelo con los codos a 45°.','Sube empujando. Al tener los pies más altos, trabaja más la parte superior del pecho y el hombro.'],
  'Pike push ups': ['Desde plancha, lleva los pies hacia las manos y sube la cadera hasta formar una V invertida.','Manos a la anchura de los hombros, piernas lo más estiradas posible.','Dobla los codos y baja la cabeza hacia el suelo, entre las manos y ligeramente por delante.','Empuja para volver arriba. Es un press de hombro con tu peso: mantén la cadera alta todo el rato.'],
  'Mike Tysons': ['Empieza en V invertida, igual que el pike push up.','Dobla los codos y baja la cabeza hacia el suelo, llevándola hacia delante entre las manos.','Sigue el movimiento en arco: pasa el pecho cerca del suelo y termina con los brazos estirados y el pecho arriba, cadera baja.','Vuelve por el mismo camino hasta la V invertida. Hazlo lento, sobre todo la bajada.','Si en tu plan lo haces con los pies en la pared, sigue igual: la idea es controlar el descenso.'],
  'Superman con jalón': ['Túmbate boca abajo con los brazos estirados por delante de la cabeza.','Despega un poco el pecho, los brazos y las piernas del suelo. Mirada al suelo, cuello neutro.','Tira de los codos hacia las costillas como si bajaras una barra de dominadas.','Aprieta la espalda 1 segundo con los codos junto al cuerpo y vuelve a estirar los brazos sin apoyarlos.','Trabaja el dorsal, el músculo de la anchura de espalda.'],
  'Y-T-W en el suelo': ['Boca abajo, frente apoyada o a 2 cm del suelo, pulgares hacia arriba.','Y: brazos estirados por delante en diagonal; súbelos despegándolos del suelo, pausa 1 s y baja. Haz 8.','T: brazos en cruz a la altura de los hombros; súbelos, pausa 1 s y baja. Haz 8.','W: codos doblados pegados al cuerpo y manos a la altura de los hombros; junta las escápulas subiendo codos y manos, pausa 1 s. Haz 8.','Movimiento lento y sin impulso: trabaja la espalda alta y el hombro posterior.'],
  'Mountain climbers': ['Plancha alta: manos bajo los hombros y cuerpo recto.','Lleva una rodilla hacia el pecho y vuelve atrás mientras llevas la otra, como si corrieras en el sitio.','Cadera baja y estable, sin subirla en pico.','Ritmo rápido durante los 20 segundos.'],
  'Plank jacks': ['Plancha alta con los pies juntos y manos bajo los hombros.','Salta abriendo los pies a los lados, más que la anchura de la cadera, y vuelve a juntarlos.','El tronco no se mueve: solo saltan las piernas.','Abdomen apretado para que la cadera no baile.'],
  'Bear plank knee taps': ['A cuatro patas: manos bajo los hombros y rodillas bajo la cadera.','Despega las rodillas 2–3 cm del suelo. Espalda plana, como una mesa.','Toca con una mano la rodilla contraria y vuelve a apoyarla; alterna lados.','La cadera no debe girar ni subir. Respira sin bloquear.'],
  'Spiderman plank': ['Plancha alta con el cuerpo recto.','Lleva una rodilla por fuera, hacia el codo del mismo lado, como si trepara una araña.','Vuelve a la plancha y repite con la otra pierna.','Mantén la cadera baja: el trabajo está en los oblicuos.'],
  'Plank hip twists': ['Plancha sobre los antebrazos, codos bajo los hombros y pies algo separados.','Gira la cadera para acercar un lado al suelo sin apoyarlo.','Vuelve al centro y gira hacia el otro lado.','Los hombros quedan quietos: solo rota la cadera, con control.'],
  'Cross-body mountain climbers': ['Plancha alta, manos bajo los hombros.','Lleva la rodilla derecha hacia el codo izquierdo cruzando por debajo del cuerpo.','Vuelve y lleva la rodilla izquierda hacia el codo derecho.','Ritmo rápido, cadera baja y hombros estables encima de las manos.'],
  'Plancha': ['Antebrazos en el suelo con los codos bajo los hombros y pies juntos.','Cuerpo en línea recta de la cabeza a los talones.','Aprieta abdomen y glúteos como si quisieras acercar los codos a los pies.','Respira de forma continua y no dejes caer la cadera hasta el final del tiempo.'],
  'Hip thrust': ['Siéntate en el suelo con la parte alta de la espalda apoyada en el borde de un banco y la barra (con protector) sobre la cadera.','Pies apoyados a la anchura de la cadera, rodillas dobladas.','Empuja con los talones y sube la cadera hasta que el tronco quede paralelo al suelo y las rodillas a 90°.','Aprieta el glúteo 1 s arriba, barbilla hacia el pecho, y baja controlado.'],
  'Sentadilla búlgara': ['De espaldas a un banco, apoya el empeine de un pie en él y adelanta el otro un paso largo.','Con mancuernas en las manos, baja en vertical hasta que la rodilla trasera casi toque el suelo.','La rodilla delantera sigue la punta del pie; el peso va en el talón delantero.','Sube empujando con la pierna de delante. Haz todas las repeticiones y cambia de pierna.'],
  'Peso muerto': ['Pies a la anchura de la cadera, barra sobre la mitad del pie, pegada a las espinillas.','Cadera atrás, espalda recta y pecho alto; agarra la barra justo por fuera de las piernas.','Empuja el suelo con las piernas y sube la barra pegada al cuerpo hasta quedar de pie.','Baja llevando la cadera atrás, sin redondear la espalda. Empieza ligero y sube el peso en cada serie.'],
  'Patada en polea a 45°': ['Engancha la tobillera a la polea baja e inclínate ligeramente adelante agarrado a la máquina.','Con la rodilla casi estirada, lleva la pierna atrás y hacia fuera en diagonal (45°).','Aprieta el glúteo arriba 1 s sin arquear la lumbar.','Vuelve despacio. Haz todas con una pierna y cambia.'],
  'Femoral en máquina': ['Túmbate boca abajo con el rodillo justo encima de los talones y las rodillas al borde del banco.','Cadera pegada al banco: sube los talones hacia el glúteo.','Baja lento, unos 2–3 s.','Haz 10 con peso alto y, sin descansar, baja el peso a la mitad y haz 10 más.'],
  'Crunch': ['Boca arriba, rodillas dobladas y manos detrás de la cabeza sin entrelazar fuerte.','Despega los hombros del suelo acercando las costillas a la cadera.','No tires del cuello: la mirada va hacia el techo.','Baja controlado sin apoyar del todo la cabeza.'],
  'Pájaros (postura)': ['De pie, inclina el tronco adelante casi paralelo al suelo, rodillas algo flexionadas y espalda recta.','Mancuernas ligeras colgando bajo los hombros, codos un poco doblados.','Abre los brazos hacia los lados y atrás juntando las escápulas, hasta la línea de los hombros.','Baja lento. Trabaja el hombro posterior y la espalda alta: clave para la postura.'],
  'Pájaros': ['De pie, inclina el tronco adelante casi paralelo al suelo, rodillas algo flexionadas y espalda recta.','Mancuernas ligeras colgando bajo los hombros, codos un poco doblados.','Abre los brazos hacia los lados y atrás juntando las escápulas, hasta la línea de los hombros.','Baja lento, sin encoger el cuello ni balancear el cuerpo.'],
  'Elevaciones laterales (postura)': ['De pie, mancuernas ligeras a los lados y codos un poco flexionados.','Sube los brazos hacia los lados hasta la altura de los hombros, como si vaciaras dos jarras.','Pausa 1 s arriba sin encoger el trapecio.','Baja en 2–3 s. Sin balanceo.'],
  'Elevaciones laterales': ['De pie, mancuernas a los lados y codos un poco flexionados.','Sube los brazos hacia los lados hasta la altura de los hombros.','Pausa 1 s arriba sin encoger el trapecio.','Baja en 2–3 s. Si tienes que balancearte, el peso es demasiado alto.'],
  'Jalón en polea': ['Siéntate con las rodillas bajo los rodillos y agarra la barra algo más abierta que los hombros.','Pecho alto e inclínate un poco atrás.','Baja la barra hasta la parte alta del pecho llevando los codos hacia las costillas.','Sube controlado hasta estirar los brazos sin soltar la tensión.'],
  'Remo con mancuerna': ['Apoya una rodilla y la mano del mismo lado en el banco; espalda paralela al suelo.','Con la otra mano, la mancuerna cuelga bajo el hombro.','Tira llevando el codo hacia la cadera, pegado al cuerpo, y aprieta la espalda arriba.','Baja estirando el brazo del todo. Haz las 10 y cambia de lado.'],
  'Pullover con cuerda': ['De pie frente a la polea alta con la cuerda; da un paso atrás e inclínate un poco adelante.','Brazos casi rectos por delante, a la altura de la cabeza.','Baja la cuerda en arco hasta los muslos usando el dorsal, sin doblar los codos.','Vuelve despacio hasta notar el estiramiento en la espalda.'],
  'Curl martillo': ['De pie, mancuernas a los lados con las palmas enfrentadas.','Codos pegados al cuerpo y quietos.','Sube las mancuernas hacia los hombros sin girar las muñecas.','Baja en 2–3 s sin balancear el tronco.'],
  'Prensa de piernas': ['Siéntate con la espalda y la cadera bien apoyadas y los pies a la anchura de la cadera en la plataforma.','Quita los seguros y baja la plataforma doblando rodillas hasta unos 90°.','Las rodillas siguen la dirección de los pies; la lumbar no se despega del respaldo.','Empuja con los talones sin bloquear las rodillas arriba. Sube el peso en cada serie.'],
  'Sentadilla con barra': ['Barra apoyada sobre los trapecios, agarre algo más abierto que los hombros.','Pies a la anchura de los hombros, puntas un poco hacia fuera.','Baja con la cadera atrás y abajo hasta que los muslos queden paralelos, pecho alto.','Sube empujando el suelo con todo el pie. Empieza ligero y sube el peso en cada serie.'],
  'Zancadas con mancuernas': ['De pie con una mancuerna en cada mano.','Da un paso largo y baja hasta que la rodilla de atrás casi toque el suelo.','Rodilla delantera sobre el tobillo, torso recto.','Vuelve empujando con el talón delantero. 10 con cada pierna.'],
  'Sillón de cuádriceps': ['Siéntate con la espalda apoyada y el rodillo sobre los tobillos; rodillas alineadas con el eje de la máquina.','Extiende las rodillas hasta casi estirar las piernas.','Aprieta el cuádriceps 1 s arriba y baja en 2–3 s.','Haz 3 series de 10 y una cuarta hasta el fallo.'],
  'Russian twist con peso': ['Sentado, rodillas dobladas y tronco inclinado unos 45° atrás, con el disco o balón en las manos.','Si puedes, despega los pies del suelo.','Gira el tronco llevando el peso a un lado y luego al otro: cada lado cuenta 1.','Espalda recta, sin encorvarte. 10 por lado.'],
  'Elevación de gemelos': ['De pie, con mancuernas en las manos o en la máquina, la punta de los pies en un escalón si puedes.','Sube de puntillas lo más alto posible.','Pausa 1 s arriba.','Baja lento hasta notar el estiramiento del gemelo.'],
  'Press militar': ['Sentado con la espalda apoyada, barra a la altura de la clavícula y agarre algo más abierto que los hombros.','Abdomen firme y pies bien apoyados.','Empuja la barra hacia arriba hasta estirar los brazos sobre la cabeza.','Baja controlado hasta la barbilla sin arquear la zona lumbar.'],
  'Elevaciones frontales': ['De pie, mancuernas delante de los muslos.','Sube los brazos al frente, casi rectos, hasta la altura de los ojos.','Pausa breve arriba.','Baja en 2–3 s sin balancear el tronco.'],
  'Apertura de pecho en máquina': ['Ajusta el asiento para que los agarres queden a la altura del pecho.','Espalda pegada al respaldo y codos ligeramente flexionados.','Cierra los brazos delante del pecho apretando el pectoral.','Abre despacio hasta notar el estiramiento sin que los codos pasen la línea de los hombros.'],
  'Extensión de tríceps en polea': ['De pie frente a la polea alta, agarra la barra o cuerda con los codos pegados al cuerpo.','Tronco un poco inclinado adelante.','Estira los brazos hacia abajo moviendo solo los antebrazos.','Sube controlado hasta los 90° sin separar los codos.'],
  'Aductores en máquina': ['Siéntate con la espalda apoyada y las almohadillas por dentro de las rodillas.','Empieza con las piernas abiertas.','Cierra las piernas apretando la parte interna del muslo.','Abre despacio sin dejar que el peso golpee.'],
  'Abductores en máquina': ['Siéntate con la espalda apoyada y las almohadillas por fuera de las rodillas.','Empieza con las piernas juntas.','Abre las piernas empujando con la parte externa de la cadera.','Vuelve despacio controlando el peso.'],
  'Calentamiento: bici, cinta o elíptica': ['Elige bici estática, cinta (andando rápido o trote suave) o elíptica.','Empieza 2 minutos muy suave y ve subiendo el ritmo.','Mantén un ritmo en el que puedas hablar pero notes que sube el pulso y empiezas a sudar un poco.','Si quieres, en los últimos minutos haz unas sentadillas sin peso y círculos de brazos.'],
  'Isquios sentado': ['Siéntate con las piernas estiradas y juntas, pies apuntando al techo.','Espalda recta: inclínate desde la cadera llevando el pecho hacia las rodillas.','Llega hasta notar tensión detrás de los muslos, sin dolor ni rebotes.','Respira lento y en cada exhalación baja un poco más.'],
  'Cuádriceps de pie': ['De pie, apóyate en una pared si lo necesitas.','Dobla una rodilla y agarra el empeine, llevando el talón hacia el glúteo.','Rodillas juntas y cadera ligeramente adelante para notarlo en la parte delantera del muslo.','A mitad del tiempo cambia de pierna.'],
  'Flexor de cadera en zancada': ['Apoya una rodilla en el suelo (sobre una toalla) y el otro pie adelante, rodilla a 90°.','Aprieta el glúteo de la pierna de atrás y lleva la cadera hacia delante.','Notarás el estiramiento en la parte delantera de la cadera de atrás. Puedes subir el brazo de ese lado.','A mitad del tiempo cambia de pierna.'],
  'Glúteo tumbado (figura 4)': ['Túmbate boca arriba con las rodillas dobladas.','Cruza el tobillo derecho sobre la rodilla izquierda, formando un 4.','Agarra el muslo izquierdo y acércalo al pecho hasta notar el glúteo derecho.','Cabeza y espalda relajadas en el suelo. A mitad del tiempo cambia de lado.'],
  'Gemelo en la pared': ['De frente a una pared, apoya las manos a la altura del pecho.','Lleva una pierna atrás estirada con el talón en el suelo y dobla la de delante.','Inclina el cuerpo hacia la pared hasta notar el gemelo de la pierna de atrás.','A mitad del tiempo cambia de pierna.'],
  'Postura del niño': ['De rodillas, siéntate sobre los talones con las rodillas algo separadas.','Inclínate adelante y estira los brazos en el suelo lo más lejos posible.','Deja caer el pecho y relaja la espalda baja.','Respira lento y profundo.'],
  'Dorsal en postura del niño': ['De rodillas, siéntate sobre los talones.','Estira los brazos al frente con las palmas en el suelo.','Empuja la cadera hacia los talones notando el estiramiento en los laterales de la espalda.','Para más estiramiento, lleva las dos manos un poco hacia un lado y luego hacia el otro.'],
  'Pecho en el marco de la puerta': ['Colócate en el marco de una puerta y apoya el antebrazo en él, con el codo a la altura del hombro.','Da un pequeño paso adelante y gira el cuerpo suavemente hacia el lado contrario.','Notarás el estiramiento en el pecho y la parte delantera del hombro.','A mitad del tiempo cambia de brazo.'],
  'Hombro cruzado': ['De pie o sentado, lleva un brazo estirado cruzando por delante del pecho.','Con la otra mano, sujétalo por encima del codo y acércalo al cuerpo.','Hombros bajos, lejos de las orejas.','A mitad del tiempo cambia de brazo.'],
  'Tríceps por encima de la cabeza': ['Sube un brazo y dobla el codo para llevar la mano hacia la espalda.','Con la otra mano, empuja suavemente el codo hacia atrás y abajo.','Mantén la espalda recta, sin arquear la zona lumbar.','A mitad del tiempo cambia de brazo.'],
  'Curl de bíceps con mancuernas': ['De pie, una mancuerna en cada mano con las palmas hacia delante.','Codos pegados al cuerpo y quietos.','Sube las mancuernas hacia los hombros apretando el bíceps.','Baja en 2–3 s sin balancear el tronco.'],
  'Patada de tríceps con mancuerna': ['Apoya una mano y una rodilla en un banco (o inclínate adelante con la espalda recta).','Con la otra mano, sube el codo pegado al cuerpo hasta que el brazo quede paralelo al suelo.','Sin mover el codo, estira el brazo hacia atrás hasta dejarlo recto.','Vuelve despacio. Haz todas con un brazo y cambia.'],
  'Press de hombro con mancuernas': ['De pie o sentado, mancuernas a la altura de los hombros con las palmas hacia delante.','Abdomen firme y espalda recta.','Empuja las mancuernas hacia arriba hasta casi juntarlas sobre la cabeza.','Baja controlado hasta la altura de las orejas. Peso ligero: es un bloque de activación.'],
  'Plancha frontal': ['Antebrazos en el suelo con los codos bajo los hombros.','Cuerpo en línea recta de la cabeza a los talones.','Aprieta abdomen y glúteos y respira de forma continua.'],
};

function fk(p){
  const r=d=>d*Math.PI/180, st=(o,a,l)=>[o[0]+l*Math.cos(r(a)), o[1]+l*Math.sin(r(a))];
  const H=[0,0], S=st(H,p.t,LEN.t);
  const leg=q=>{ const k=st(H,q[0],LEN.th); return [H,k,st(k,q[1],LEN.sh)]; };
  const arm=q=>{ const e=st(S,q[0],LEN.ua); return [S,e,st(e,q[1],LEN.fa)]; };
  return { head:st(S,p.t,LEN.hd), torso:[H,S], l1:leg(p.l1), l2:leg(p.l2||p.l1), a1:arm(p.a1), a2:arm(p.a2||p.a1) };
}

function figure(key){
  if (!key || !POSES[key]) return '';
  if (FIGC[key]) return FIGC[key];
  const meta=POSES[key][2]; const fs=POSES[key].slice(0,2).map(p=>{ const f=fk(p);
    const pts=[f.head,...f.torso,...f.l1,...f.l2,...f.a1,...f.a2];
    const maxY=Math.max(f.head[1]+5, ...pts.map(q=>q[1]));
    const dy=FLOOR-1.6-maxY-(p.air||0);
    const mv=q=>[q[0],q[1]+dy];
    return { head:mv(f.head), torso:f.torso.map(mv), l1:f.l1.map(mv), l2:f.l2.map(mv), a1:f.a1.map(mv), a2:f.a2.map(mv) };
  });
  const xs=fs.flatMap(f=>[f.head,...f.torso,...f.l1,...f.l2,...f.a1,...f.a2].map(q=>q[0]));
  const dx=60-(Math.min(...xs)+Math.max(...xs))/2;
  const P=arr=>arr.map(q=>`${(q[0]+dx).toFixed(1)},${q[1].toFixed(1)}`).join(' ');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anim=(attr,a,b)=> still?'':`<animate attributeName="${attr}" values="${a};${b};${a}" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.6s" repeatCount="indefinite"/>`;
  const [A,B]=fs;
  let straps='';
  if (meta && meta.to) meta.to.forEach(k=>{
    const sp=f=>{ const e=f[k][2]; return meta.anc==='above' ? [[e[0],2],e] : [[meta.anc[0]-dx,meta.anc[1]],e]; };
    const a=P(sp(A)), b=P(sp(B));
    straps+=`<polyline class="strap" points="${still?b:a}">${anim('points',a,b)}</polyline>`;
  });
  if (meta && meta.tag) straps+=`<text class="tag" x="6" y="11">${meta.tag}</text>`;
  if (meta && meta.box){ const bp=F=>meta.box==='seat'?F.torso[0]:meta.box==='sh'?F.torso[1]:F[meta.box][2]; const fa=bp(A), fb=bp(B); const fy=Math.min(fa[1],fb[1])+2.5, fx=(fa[0]+fb[0])/2+dx;
    straps+=`<rect class="box" x="${(fx-13).toFixed(1)}" y="${fy.toFixed(1)}" width="18" height="${(FLOOR-fy).toFixed(1)}" rx="2"/>`; }
  if (meta && meta.anc && meta.anc!=='above') straps+=`<circle class="anchor" r="2" cx="${meta.anc[0]}" cy="${meta.anc[1]}"/>`;
  const line=(k,cls)=>`<polyline class="${cls}" points="${P(still?B[k]:A[k])}">${anim('points',P(A[k]),P(B[k]))}</polyline>`;
  const svg=`<svg class="fig" viewBox="0 0 120 78" role="img" aria-label="Ejemplo del movimiento">
    <line x1="6" y1="${FLOOR}" x2="114" y2="${FLOOR}" class="floor"/>
    ${straps}${line('l2','back')}${line('a2','back')}${line('torso','')}${line('l1','')}${line('a1','')}
    <circle r="5" cx="${(still?B:A).head[0]+dx}" cy="${(still?B:A).head[1]}">${anim('cx',A.head[0]+dx,B.head[0]+dx)}${anim('cy',A.head[1],B.head[1])}</circle></svg>`;
  return FIGC[key]=svg;
}

function filePick(cb, accept='image/*'){

function nsk(k){ return (AUTH && k.startsWith('wk.')) ? 'u.'+AUTH.key+'.'+k : k; }
/* Copia espejo en IndexedDB: si el navegador vacía el almacenamiento rápido, se recupera de aquí */
let IDBP=null;
function idb(){ if (IDBP) return IDBP; IDBP=new Promise((res,rej)=>{ try{ const r=indexedDB.open('vpwod',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return IDBP; }
function idbPut(k,v){ idb().then(db=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); }).catch(()=>{}); }
function idbDel(k){ idb().then(db=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); }).catch(()=>{}); }
function idbAll(){ return idb().then(db=>new Promise(res=>{ const out={}, t=db.transaction('kv','readonly'), st=t.objectStore('kv'), rq=st.openCursor();
  rq.onsuccess=()=>{ const c=rq.result; if (c){ out[c.key]=c.value; c.continue(); } else res(out); }; rq.onerror=()=>res(out); })).catch(()=>({})); }
async function syncIDB(){
  try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const all=await Promise.race([idbAll(), new Promise(r=>setTimeout(()=>r({}),1500))]);
  ['wk.sessions','wk.settings','wk.custom','wk.active','wk.lastbackup'].forEach(k=>{ const key=nsk(k); let ls=null; try{ ls=localStorage.getItem(key); }catch(e){}
    if (ls==null && all[key]!=null){ try{ localStorage.setItem(key, all[key]); }catch(e){} }   /* recuperar */
    else if (ls!=null && all[key]!==ls) idbPut(key, ls); });                                       /* reflejar */
}
function lsGet(k){ try{ let v=localStorage.getItem(nsk(k)); if (v==null && AUTH && AUTH.key==='victorp' && k.startsWith('wk.')) v=localStorage.getItem(k); return JSON.parse(v); }catch(e){ return null; } }
function lsSet(k,v){ const j=JSON.stringify(v); try{ localStorage.setItem(nsk(k), j); }catch(e){} if (k.startsWith('wk.')) idbPut(nsk(k), j); }
function lsDel(k){ try{ localStorage.removeItem(nsk(k)); }catch(e){} if (k.startsWith('wk.')) idbDel(nsk(k)); }

function queue(fn){ R.chain = R.chain.then(fn).catch(()=>{}); return R.chain; }
async function mergeCol(col, localArr, sortKey){
  const snap = await col.get();
  const map = new Map(localArr.map(s=>[s.id,s])); const remote = new Set();
  snap.docs.forEach(d=>{ const v=d.data(); if (v && v.id){ remote.add(v.id); map.set(v.id, v); } });
  const localOnly = localArr.filter(s=>!remote.has(s.id));
  let arr=[...map.values()]; if (sortKey) arr.sort((a,b)=>(a[sortKey]||0)-(b[sortKey]||0));
  return { arr, localOnly };
}

    const uid = await user.id(); if (!uid) return;

    if (!$('#ov').innerHTML) render();

function defaultCfg(r){ return { include:r.blocks.map(()=>true), rounds:r.blocks.map(b=>b.circuit?b.rounds:null) }; }
function compile(r, cfg){
  const steps=[]; const kgCat = ['fuerza','otra'].includes(r.cat||'fuerza');
  const mk=(e,bi,set,of,rest,extra)=>({ bi, name:e.n, reps:String(e.r||''), time:+(e.time||e.cap)||0, cap:!!e.cap, tip:e.t||'', w:e.w||'', img:e.img||'', photo:photoOf(e), how:(e.d||HOW[e.n]||[]),
    kg: kgCat && !e.img && !e.time, set, of, rest, rest0:rest, ...extra });
  r.blocks.forEach((b,bi)=>{
    if (!cfg.include[bi]) return;
    if (b.circuit){
      const RR=cfg.rounds[bi]||b.rounds||1;
      for (let k=1;k<=RR;k++) b.items.forEach((it,ii)=>{
        steps.push(mk(it,bi,k,RR, ii===b.items.length-1 ? (+b.roundRest||0) : (+b.between||0), {round:true, group:b.n}));
      });
    } else {
      const n=Math.max(1,+b.s||1);
      for (let k=1;k<=n;k++) steps.push(mk(b,bi,k,n,+b.rest||0,{}));
    }
  });
  if (steps.length) steps[steps.length-1].rest = 0;
  return steps;
}
function estimate(steps){
  return steps.reduce((a,s)=>{
    let work = s.time || 40;
    if (/min/.test(s.reps)) { const m=s.reps.match(/(\d+)\D+(\d+)?/); work = (m? +(m[2]||m[1]) : 30)*60*0.8; }
    return a + work + s.rest;
  },0);
}
/* Ajustes guardados por rutina: descansos y orden de bloques */
function ovOf(id){ S.settings.ov=S.settings.ov||{}; const r=RBY[id]; return S.settings.ov[id]=S.settings.ov[id]||(r&&r.warm?{wv:1}:{}); }
function effR(r){
  const ov=(S.settings.ov||{})[r.id];
  if (ov && r.warm && ov.wv!==1){
    if (ov.rest){ const nr={}; Object.entries(ov.rest).forEach(([k,v])=>nr[+k+1]=v); ov.rest=nr; }
    if (Array.isArray(ov.order) && ov.order.length===r.blocks.length-1) ov.order=[0, ...ov.order.map(i=>i+1)];
    ov.wv=1;
  }
  const blocks=r.blocks.map((b,i)=>{ const c={ ...b, _oi:i }; if (b.warm){ const w=warmCfg(); c.n=w.n; c.time=w.min*60; c.r=`${w.min} min`; } return c; });
  if (ov && ov.rest) blocks.forEach(b=>{ const v=ov.rest[b._oi]; if (v!=null){ if (b.circuit) b.roundRest=v; else b.rest=v; } });
  const o=ov && ov.order;
  if (Array.isArray(o) && o.length===blocks.length && new Set(o).size===o.length && o.every(i=>Number.isInteger(i)&&i>=0&&i<blocks.length)) return { ...r, blocks:o.map(i=>blocks[i]) };
  return { ...r, blocks };
}
function blockRest(b){ return b.circuit ? (+b.roundRest||0) : (+b.rest||0); }
function blockSets(b){ return b.circuit ? (b.rounds||1)*b.items.length : (+b.s||1); }
function totalSets(r){ return r.blocks.reduce((a,b)=>a+blockSets(b),0); }

function viewHoy(){
  const now=new Date(), di=dowIdx(now), m=S.settings.mode;
  const sched=S.settings.schedule[m][di]; const selId=PICK||sched; const picked=selId!==sched;
  const r=getR(selId);
  const active = lsGet('wk.active');
  let card;
  if (!PICK){
    const sr=getR(sched);
    card = `<div class="today ${m}"><p class="kicker">Entreno de hoy</p><h2>Elige tu rutina</h2>
      <p class="muted" style="margin-top:8px">Selecciona el tipo de rutina y la rutina en los desplegables de arriba y aquí aparecerá el entreno.</p>
      ${sr?`<div class="actions"><button class="btn ghost" id="seePlan">Ver lo que toca hoy en mi plan</button></div>`:''}</div>`;
  } else if (!r){
    card = `<div class="today ${m}"><p class="kicker">${picked?'Has elegido':'Hoy toca'}</p><h2>Descanso</h2>
      <p class="muted" style="margin-top:8px">Paseo suave y a recuperar. Si te apetece moverte, prueba los estiramientos o elige cualquier rutina.</p>
      <div class="actions"><button class="btn primary" data-open="est">Estiramientos</button><button class="btn ghost" data-goto="rutinas">Ver rutinas</button></div></div>`;
  } else {
    const er=effR(r), steps=compile(er, defaultCfg(er));
    card = `<div class="today ${r.mode}">
      <p class="plantitle">${esc(planOf(r))}</p>
      <p class="kicker">${picked?'Has elegido':'Hoy toca'}</p>
      <h2>${esc(r.name)}</h2><p class="muted">${esc(r.sub)}</p>
      <div class="facts"><div><b>${r.blocks.length}</b><span>bloques</span></div><div><b>${totalSets(r)}</b><span>series</span></div><div><b>~${Math.round(estimate(steps)/60)}</b><span>minutos</span></div></div>
      <ul class="exlist">${er.blocks.map(b=>`<li><span>${esc(b.n)}</span><span>${b.circuit?`${b.rounds} rondas`:b.warm?esc(b.r):`${b.s} × ${esc(b.r)}`}</span></li>`).join('')}</ul>
      <div class="actions"><button class="btn primary block" data-open="${esc(r.id)}">Empezar</button></div></div>`;
  }
  const ws=weekSessions(); const doneDays=new Set(ws.map(s=>dowIdx(new Date(s.start))));
  const wsec=ws.reduce((a,s)=>a+s.duration,0);
  const strip = DOW3.map((d,i)=>{ const rr=getR(S.settings.schedule[m][i]);
    return `<div class="day ${i===di?'now':''} ${doneDays.has(i)?'done':''}"><b>${d}</b><span class="lab">${rr?esc(rr.short||rr.name):'—'}</span><span class="tick">${doneDays.has(i)?'✓':''}</span></div>`; }).join('');
  return `
    <div class="hoyhead"><div>
    <p class="muted">${cap(DOW[di])}</p>
    <h1>${now.getDate()} de ${MONTHS[now.getMonth()]}</h1></div><img class="applogo" src="${LOGO}" alt="VP WOD App" width="76" height="76"></div>
    <div class="pickers">
      <div class="field"><label for="hoyMode">Tipo de rutina</label><select class="t big" id="hoyMode">
        <option value="" disabled ${MODE_PICKED?'':'selected'}>Elegir…</option><option value="home" ${MODE_PICKED&&m==='home'?'selected':''}>Rutina Gym</option><option value="go" ${MODE_PICKED&&m==='go'?'selected':''}>On the go</option></select></div>
      <div class="field"><label for="hoyR">Rutina</label><select class="t big" id="hoyR">${routineOptions(PICK||'')}</select></div>
    </div>
    ${PICK?`<button class="linkbtn" id="backPlan">Cerrar esta rutina</button>`:''}
    ${active?`<div class="banner"><p><strong>Tienes un entreno a medias:</strong> ${esc(active.routineName)}.</p>
      <div class="actions" style="margin-top:10px"><button class="btn primary" id="resume">Reanudar</button><button class="btn ghost" id="discardActive">Descartar</button></div></div>`:''}
    <section>${card}</section>
    <section><div class="row between"><h3>Esta semana</h3><button class="btn ghost sm" id="editPlan">Editar plan</button></div>
      <div class="week">${strip}</div>
      <div class="stats"><div class="stat"><b>${ws.length}</b><span>sesiones</span></div><div class="stat"><b>${dur(wsec)}</b><span>entrenadas</span></div></div>
    </section>`;
}

function routineCard(r){
  const st=compile(r,defaultCfg(r));
  const thumb = r.blocks.map(b=>b.circuit?b.items[0]:b).find(e=>e && (photoOf(e)||e.img));
  return `<button class="rcard" data-open="${esc(r.id)}">
    <div class="rc-in">${thumb?`<div class="rthumb">${visual(thumb)}</div>`:''}
    <div style="flex:1;min-width:0"><p class="plantitle">${esc(planOf(r))}</p><div class="row between"><h3>${esc(r.name)}</h3><span class="muted small">~${Math.round(estimate(st)/60)} min</span></div>
    <p class="muted small" style="margin-top:2px">${esc(r.sub||'')}${r.sub?', ':''}${totalSets(r)} series</p>
    <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap"><span class="tag ${r.mode==='go'?'go':''}">${r.mode==='go'?'On the go':'Gym'}</span><span class="tag plain">${esc(CATN[r.cat]||'Otra')}</span>${r.custom?'<span class="tag plain">Importada</span>':''}</div></div></div></button>`;
}
let RPLAN='all';
function viewRutinas(){
  const groups=new Map(); allR().forEach(r=>{ const t=planOf(r); if (!groups.has(t)) groups.set(t,[]); groups.get(t).push(r); });
  if (RPLAN!=='all' && !groups.has(RPLAN)) RPLAN='all';
  const shown=[...groups].filter(([t])=>RPLAN==='all'||t===RPLAN);
  const total=allR().length;
  return `<div class="row between"><h1>Rutinas</h1><button class="btn primary sm" id="impBtn">Importar</button></div>
    <p class="muted small" style="margin-top:6px">Sube un Excel, un PDF o fotos de una rutina: la app la convierte y recorta la imagen de cada ejercicio.</p>
    <div class="chips" role="group" aria-label="Filtrar por plan">
      <button class="chip" data-plan="all" aria-pressed="${RPLAN==='all'}">Todas <span>${total}</span></button>
      ${[...groups].map(([t,l])=>`<button class="chip" data-plan="${esc(t)}" aria-pressed="${RPLAN===t}">${esc(t)} <span>${l.length}</span></button>`).join('')}
    </div>

function period(){
  const now=new Date(); let from,to,label,buckets=[];
  if (H.range==='week'){
    from=monday(now); from.setDate(from.getDate()+H.offset*7); to=new Date(from); to.setDate(to.getDate()+7);
    const end=new Date(to); end.setDate(end.getDate()-1);
    label = H.offset===0?'Esta semana':`${from.getDate()} ${MONTHS[from.getMonth()].slice(0,3)} – ${end.getDate()} ${MONTHS[end.getMonth()].slice(0,3)}`;
    for (let i=0;i<7;i++){ const a=new Date(from); a.setDate(a.getDate()+i); const b=new Date(a); b.setDate(b.getDate()+1); buckets.push({a:+a,b:+b,label:DOW3[i],show:true}); }
  } else if (H.range==='month'){
    from=new Date(now.getFullYear(), now.getMonth()+H.offset, 1); to=new Date(from.getFullYear(), from.getMonth()+1, 1);
    label = `${cap(MONTHS[from.getMonth()])} ${from.getFullYear()}`;
    for (let i=0;i<Math.round((+to-+from)/864e5);i++){ const a=new Date(from.getFullYear(),from.getMonth(),i+1), b=new Date(from.getFullYear(),from.getMonth(),i+2);
      buckets.push({a:+a,b:+b,label:String(i+1),show:(i===0||(i+1)%5===0)}); }
  } else {
    from=new Date(now.getFullYear()+H.offset,0,1); to=new Date(from.getFullYear()+1,0,1); label=String(from.getFullYear());
    for (let i=0;i<12;i++) buckets.push({a:+new Date(from.getFullYear(),i,1),b:+new Date(from.getFullYear(),i+1,1),label:MON3[i],show:true});
  }
  return {from:+from,to:+to,label,buckets};
}
function chartSVG(buckets, sessions){
  buckets.forEach(b=>{ b.home=0; b.go=0; sessions.forEach(s=>{ if (s.start>=b.a&&s.start<b.b) b[s.mode==='go'?'go':'home'] += s.duration/60; }); });
  const max=Math.max(30, ...buckets.map(b=>b.home+b.go));
  const step = max<=60?15: max<=180?60: max<=600?120: max<=1500?300: 600;
  const top=Math.ceil(max/step)*step;
  const W=340,Hh=170,L=34,B=22,T=8, cw=(W-L-4)/buckets.length, bw=Math.max(3,Math.min(26,cw*0.62));
  const y=v=>T+(Hh-T-B)*(1-v/top);
  let g='';
  for (let v=0; v<=top; v+=step){ g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=60?(v/60)+'h':v+'m'}</text>`; }
  buckets.forEach((b,i)=>{
    const x=L+i*cw+(cw-bw)/2;
    if (b.home>0) g+=`<rect x="${x}" y="${y(b.home)}" width="${bw}" height="${y(0)-y(b.home)}" rx="2.5" fill="var(--work)"><title>${Math.round(b.home)} min en el gym</title></rect>`;
    if (b.go>0) g+=`<rect x="${x}" y="${y(b.home+b.go)}" width="${bw}" height="${y(b.home)-y(b.home+b.go)}" rx="2.5" fill="var(--go)"><title>${Math.round(b.go)} min on the go</title></rect>`;
    if (b.show) g+=`<text x="${x+bw/2}" y="${Hh-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${b.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Minutos entrenados por periodo">${g}</svg>`;
}

/* Arrastrar para ordenar: genérico (vista previa y durante el entreno) */
function makeSortable(items, handleSel, sc, onDrop){
  items.forEach((el,idx)=>{
    const h=el.querySelector(handleSel); if (!h) return;
    h.onpointerdown=e=>{
      if (e.button>0) return; e.preventDefault();
      const from=idx, rects=items.map(x=>x.getBoundingClientRect()), gap=items[1]?Math.max(0,rects[1].top-rects[0].bottom):8, step=rects[from].height+gap, s0=sc.scrollTop, y0=e.clientY;
      let y=e.clientY, to=from, raf=0, alive=true;
      try{ h.setPointerCapture(e.pointerId); }catch(_){}
      el.classList.add('dragging'); items.forEach(x=>{ if (x!==el) x.classList.add('shift'); }); buzz(15);
      const lo=sc.getBoundingClientRect?sc.getBoundingClientRect():{top:0,bottom:innerHeight};
      const top=Math.max(0,lo.top), bot=Math.min(innerHeight,lo.bottom||innerHeight);
      const update=()=>{
        const dy=y-y0+(sc.scrollTop-s0); el.style.transform=`translateY(${dy}px)`;
        const mid=rects[from].top+rects[from].height/2+dy;
        to=0; rects.forEach((r,i)=>{ if (i!==from && mid>r.top+r.height/2) to++; });
        items.forEach((x,i)=>{ if (i===from) return; let t=0; if (from<to && i>from && i<=to) t=-step; if (to<from && i>=to && i<from) t=step; x.style.transform=t?`translateY(${t}px)`:''; });
      };
      const loop=()=>{ if (!alive) return; if (y<top+80) sc.scrollTop-=Math.ceil((top+80-y)/6); else if (y>bot-100) sc.scrollTop+=Math.ceil((y-(bot-100))/6); update(); raf=requestAnimationFrame(loop); };
      h.onpointermove=ev=>{ y=ev.clientY; };
      const end=()=>{
        alive=false; cancelAnimationFrame(raf); h.onpointermove=null; h.onpointerup=null; h.onpointercancel=null;
        items.forEach(x=>{ x.style.transform=''; x.classList.remove('shift','dragging'); });
        if (to!==from){ buzz(25); onDrop(from,to); }
      };
      h.onpointerup=end; h.onpointercancel=end; loop();
    };
  });
}

      ${pending.length?'':'<p class="muted" style="margin-top:12px">No quedan ejercicios por mover.</p>'}
      <label class="row" style="gap:8px;margin-top:14px;font-size:.92rem"><input type="checkbox" id="roSave" checked> Guardar este orden para las próximas veces</label>
      <div class="actions"><button class="btn ghost" id="mNo">Cancelar</button><button class="btn primary" id="mOk">Aplicar</button></div></div></div>`;
    makeSortable([...document.querySelectorAll('#roList > .roitem')], '.drag', $('#roSheet'), (from,to)=>{ const [m]=pending.splice(from,1); pending.splice(to,0,m); draw(); });

  };

function applyReorder(locked, pending, save){
  const cur=W.steps[W.i], wasRest=W.phase==='rest', curLocked=locked.some(b=>b.bi===cur.bi);
  const doneSet=new Set(W.steps.filter((x,i)=>W.done[i]));
  const steps=[...locked, ...pending].flatMap(b=>b.steps);
  steps.forEach(x=>{ if (x.rest0!=null) x.rest=x.rest0; });
  if (steps.length) steps[steps.length-1].rest=0;
  W.steps=steps; W.done=steps.map(x=>doneSet.has(x));
  const firstPending=steps.findIndex((x,i)=>!W.done[i]);
  if (wasRest || curLocked){ W.i=steps.indexOf(cur); if (!wasRest){ persistActive(); drawPlayer(); } else { persistActive(); drawPlayer(); } }
  else goTo(firstPending<0?0:firstPending, true);
  if (save && W.oi){
    const base=getR(W.routineId);
    if (base){
      const inc=[...locked,...pending].map(b=>b.bi), incSet=new Set(inc); let k=0;
      const full=W.oi.map((_,bi)=> incSet.has(bi) ? inc[k++] : bi);
      const order=full.map(bi=>W.oi[bi]);
      if (order.length===base.blocks.length){ ovOf(base.id).order=order; saveSettings(); }
    }
  }
  buzz(30);
}

  const prevScroll=(document.querySelector('#ov .ov')||{}).scrollTop||0, keep=!!$('#pvList');

  $('#ov').innerHTML=`<div class="ov" style="--accent:${accent}"><div class="wrap">
    <div class="topbar"><button class="iconbtn" id="pvClose">‹ Volver</button>

  bindDrag();
  if (keep){ const o=document.querySelector('#ov .ov'); if (o) o.scrollTop=prevScroll; }

  $('#pvVideos').onclick=()=>showVideoList(r);
